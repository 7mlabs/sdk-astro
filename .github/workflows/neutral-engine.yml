name: SDK candidate validation
# Build/install evidence only. This workflow does not publish registry packages.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    name: Candidate ${{ matrix.platform }}-${{ matrix.arch }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Source, documentation and metadata checks
        run: python scripts/check-repository.py
      - name: Select Rust stable explicitly
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Rust tests
        run: cargo test --manifest-path neutral-engine/Cargo.toml --locked
      - name: Packaging dependencies
        run: |
          python -m pip install setuptools wheel
          npm install --prefix artifacts/ci-tools --ignore-scripts --no-audit --no-fund typescript@5.9.3
      - name: Build packages
        run: python scripts/build-packages.py
      - name: Fresh consumer installation and parity
        run: python scripts/test-packages.py
      - name: Compression parity and real payload roundtrips
        run: python scripts/test-compression.py
      - name: Installed compression helpers and TypeScript contracts
        run: python scripts/check-compression-bindings.py --typescript artifacts/ci-tools/node_modules/typescript/lib/tsc.js
      - name: Validate candidate artifacts and evidence
        run: python scripts/check-repository.py --artifacts --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/packages/manifest.json
            artifacts/packages/7mlabs-astrology-*.tgz
            artifacts/packages/sevenmlabs_astrology-*.whl
            artifacts/packages/SevenMLabs.Astrology.*.nupkg
            artifacts/test-results.json
            artifacts/compression-test-results.json
            artifacts/compression-binding-tests.json
